# Specty configuration. Reference: docs/formats.md §6
version: 1
language: es
mode: individual
# Paths under the flow: code that needs an approved spec.
governed: ["**"]
# Free paths: documentation and non-code files.
ignored: ["**/*.md", "docs/**", "android/**", "ios/**"]
# Paths never approved automatically, weighed in the size.
sensitive:
  ["**/migrations/**", "**/auth/**", ".github/**", "**/.env*", "**/infra/**"]
verify:
  timeoutSec: 600
  default: "flutter test"
  full: "flutter analyze && flutter test"
scope:
  implicitTests: true
  generated: []
  autoApprove: tests-and-generated
policy:
  tests: recommended
retro:
  mode: agent
git:
  branchPerChange: true
