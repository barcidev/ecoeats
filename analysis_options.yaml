include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - lib/i18n/gen/**
    - build/**
    - android/**
    - ios/**
  errors:
    # freezed puts @JsonKey on constructor parameters, which the analyzer flags.
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false

plugins:
  riverpod_lint: ^3.1.9
